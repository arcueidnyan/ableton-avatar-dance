name: Native VST3
on:
  workflow_dispatch:
  push:
    paths: ['CMakeLists.txt', 'vst3/**', 'avatars/*/sprite-sheet.png', '.github/workflows/vst3.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - run: cmake --build build --config Release --target AvatarDance_VST3 --parallel 3
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path 'build/AvatarDance_artefacts/Release/VST3/Avatar Dance.vst3' -DestinationPath Avatar-Dance.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent 'build/AvatarDance_artefacts/Release/VST3/Avatar Dance.vst3' Avatar-Dance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Avatar-Dance-${{ runner.os }}
          path: Avatar-Dance.zip
